<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tack</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#fbfbfa, #15161a);
    --panel: light-dark(#f1f0ed, #1d1f24);
    --line: light-dark(#dcdad4, #2e3138);
    --text: light-dark(#1d1d1b, #e6e6e3);
    --muted: light-dark(#6b6a65, #94959b);
    --accent: light-dark(#2f5fb3, #86aef0);
    --user: light-dark(#e6ecf7, #232c3d);
    --warn: light-dark(#94400f, #eda76d);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, sans-serif;
  }
  aside {
    width: 260px; flex: none; display: flex; flex-direction: column; gap: 8px;
    padding: 12px; background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto;
  }
  aside h1 { font-size: 15px; margin: 0; padding: 4px 8px; }
  #conversations { display: flex; flex-direction: column; gap: 2px; }
  #conversations button {
    all: unset; cursor: pointer; display: block; padding: 6px 8px; border-radius: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text);
  }
  #conversations button:hover { background: var(--line); }
  #conversations button:focus-visible { outline: 2px solid var(--accent); }
  #conversations button[aria-current="true"] { background: var(--line); font-weight: 600; }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #items { flex: 1; overflow-y: auto; padding: 16px; }
  .inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .item { white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-end; max-width: 85%; padding: 8px 12px; border-radius: 10px; background: var(--user); }
  .notice { color: var(--warn); font-size: 14px; }
  .system {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); font-size: 14px;
  }
  .system-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; margin-bottom: 4px; white-space: normal; }
  .system-head strong { color: var(--text); font-weight: 600; }
  .system-head .spacer { flex: 1; }
  .tag { padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); }
  .tag.waiting { color: var(--accent); border-color: var(--accent); }
  .pending { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .pending .tag { color: var(--warn); border-color: var(--warn); }
  .hint { color: var(--muted); font-size: 12px; margin: 4px 0; white-space: normal; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .link {
    padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line);
    background: transparent; color: inherit; font: inherit; font-size: 12px; cursor: pointer;
  }
  .link:hover { background: var(--line); }
  .editor textarea { width: 100%; }
  #system-panel { max-width: 760px; width: 100%; margin: 0 auto; padding: 16px 16px 0; }
  #system-panel[hidden] { display: none; }
  #system-panel label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  #system-prompt { width: 100%; }
  .stats { color: var(--muted); font-size: 12px; margin-top: 4px; white-space: normal; }
  details { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
  summary { cursor: pointer; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  form .inner { flex-direction: row; flex: 1; width: 100%; gap: 8px; }
  .actions { display: flex; flex-direction: column; gap: 6px; }
  textarea {
    flex: 1; min-width: 0; resize: vertical; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: inherit; font: inherit;
  }
  button.action {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: inherit; font: inherit; cursor: pointer;
  }
  button.action:disabled { opacity: .5; cursor: default; }
  @media (max-width: 640px) {
    body { flex-direction: column; }
    aside { width: auto; max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--line); }
    main { min-height: 0; }
  }
</style>
</head>
<body>
<aside>
  <h1>tack</h1>
  <button class="action" id="new" type="button">New conversation</button>
  <nav id="conversations"></nav>
</aside>
<main>
  <div id="system-panel">
    <label for="system-prompt">System prompt for this conversation (clear it to send none)</label>
    <textarea id="system-prompt" rows="4"></textarea>
  </div>
  <div id="items"><div class="inner" id="list"></div></div>
  <form id="form">
    <div class="inner">
      <textarea id="input" rows="3" placeholder="Message" aria-label="Message"></textarea>
      <div class="actions">
        <button class="action" id="send" type="submit">Send</button>
        <button class="action" id="add-system" type="button" title="Waits for your next message, unless you ask the model to respond now">Add as system</button>
      </div>
    </div>
  </form>
</main>
<script>
// Everything from the server goes through textContent or a textarea's value.
// Model output is never treated as markup.
const $ = (id) => document.getElementById(id);
let current = null;
let streaming = false;
let pollTimer = null;

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function linkButton(label, onClick) {
  const b = el("button", "link", label);
  b.type = "button";
  b.addEventListener("click", () => Promise.resolve(onClick()).catch(reportError));
  return b;
}

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) throw new Error((await res.text()) || `HTTP ${res.status}`);
  return res;
}

function postJSON(path, body) {
  return api(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
}

function statsLine(s) {
  const seconds = (ms) => (ms / 1000).toFixed(1) + "s";
  const parts = [];
  if (s.host) parts.push(s.host);
  parts.push(`${s.prompt_tokens} in (${s.cached_tokens} cached)`);
  parts.push(`${s.completion_tokens} out (${s.reasoning_tokens} reasoning)`);
  parts.push("$" + s.cost_usd.toFixed(6));
  parts.push(`first token ${seconds(s.ttft_ms)}`, `total ${seconds(s.duration_ms)}`);
  return parts.join(" · ");
}

function replyNode() {
  const node = el("div", "item assistant");
  const details = el("details");
  details.hidden = true;
  details.append(el("summary", "", "Reasoning"));
  const reasoning = el("div");
  details.append(reasoning);
  const text = el("div");
  node.append(details, text);
  return { node, details, reasoning, text };
}

function editor(initial, onSave, onCancel) {
  const box = el("div", "editor");
  const area = el("textarea");
  area.rows = Math.min(12, initial.split("\n").length + 2);
  area.value = initial;
  const row = el("div", "row");
  row.append(linkButton("Hold edit", () => onSave(area.value)), linkButton("Cancel", onCancel));
  box.append(area, el("div", "hint", "Held edits stay unused until you apply them. Leave this empty to propose removing the message."), row);
  return box;
}

function renderSystem(item) {
  const id = current;
  const node = el("div", "item system");
  const head = el("div", "system-head");
  head.append(el("strong", "", "System"));
  if (item.queued) head.append(el("span", "tag waiting", "Goes with the next call"));
  if (item.edited) head.append(el("span", "tag", "Edited"));
  if (item.removed) head.append(el("span", "tag", "Removed"));
  head.append(el("span", "spacer"));
  node.append(head);
  const body = el("div", "", item.text);
  node.append(body);

  head.append(linkButton("Edit", () => {
    const form = editor(item.pending ? item.pending.text : item.text, async (text) => {
      await postJSON(`/api/conversations/${id}/system/${item.message}/edits`, { text });
      await show(id);
    }, () => form.remove());
    node.append(form);
    form.querySelector("textarea").focus();
  }));

  if (item.pending) {
    const pending = el("div", "pending");
    const label = el("div", "system-head");
    label.append(el("span", "tag", "Unused edit"));
    pending.append(label);
    pending.append(el("div", "", item.pending.text || "Remove this message."));
    if (!item.queued && !item.removed) {
      pending.append(el("div", "hint", "The model has already seen this message. Applying changes it from here on, so the next call misses the cache from this point."));
    }
    const row = el("div", "row");
    row.append(
      linkButton("Apply", async () => {
        await postJSON(`/api/conversations/${id}/edits/${item.pending.id}/apply`);
        await show(id);
      }),
      linkButton("Discard", async () => {
        await postJSON(`/api/conversations/${id}/edits/${item.pending.id}/discard`);
        await show(id);
      }),
    );
    pending.append(row);
    node.append(pending);
  }
  return node;
}

function renderItem(item) {
  if (item.role === "system") return renderSystem(item);
  if (item.role !== "assistant") {
    return el("div", `item ${item.role}`, item.text);
  }
  const r = replyNode();
  r.text.textContent = item.text;
  if (item.reasoning) {
    r.reasoning.textContent = item.reasoning;
    r.details.hidden = false;
  }
  if (item.stats) r.node.append(el("div", "stats", statsLine(item.stats)));
  return r.node;
}

function replyControl(conv) {
  const last = conv.items[conv.items.length - 1];
  let label = "Get a reply";
  if (last && last.role === "notice") label = "Retry";
  if (last && last.role === "system") label = "Ask the model to respond now";
  const row = el("div", "row");
  row.append(linkButton(label, () => runCall(conv.id)));
  return row;
}

function nearBottom() {
  const box = $("items");
  return box.scrollHeight - box.scrollTop - box.clientHeight < 80;
}

function scrollDown() {
  const box = $("items");
  box.scrollTop = box.scrollHeight;
}

async function refreshList() {
  const res = await api("/api/conversations");
  const summaries = await res.json();
  $("conversations").replaceChildren(...summaries.map((s) => {
    const b = el("button", "", (s.busy ? "… " : "") + (s.preview || "New conversation"));
    b.type = "button";
    b.setAttribute("aria-current", String(s.id === current));
    b.addEventListener("click", () => open(s.id).catch(reportError));
    return b;
  }));
}

function setBusy(busy) {
  $("send").disabled = busy;
}

async function show(id, polling) {
  clearTimeout(pollTimer);
  const res = await api(`/api/conversations/${id}`);
  const conv = await res.json();
  if (id !== current) return;
  // Don't throw away something being typed just because a poll came round.
  const typing = polling && document.querySelector("#list .editor");
  if (!typing) {
    $("list").replaceChildren(...conv.items.map(renderItem));
    if (conv.can_reply && !streaming) $("list").append(replyControl(conv));
    if (conv.busy && !streaming) {
      // A reply started before this page loaded. Its text arrives when it's done.
      $("list").append(el("div", "notice", "A reply is in progress…"));
    }
  }
  if (conv.busy) pollTimer = setTimeout(() => show(id, true).catch(reportError), 2000);
  setBusy(conv.busy);
  if (!polling) scrollDown();
}

async function open(id) {
  current = id;
  location.hash = id;
  $("system-panel").hidden = true;
  $("add-system").disabled = false;
  await refreshList();
  await show(id);
  $("input").focus();
}

async function startNew() {
  current = null;
  clearTimeout(pollTimer);
  history.replaceState(null, "", location.pathname);
  $("list").replaceChildren();
  $("system-panel").hidden = false;
  $("add-system").disabled = true;
  setBusy(false);
  const res = await api("/api/system-default");
  $("system-prompt").value = (await res.json()).text;
  await refreshList();
}

function reportError(err) {
  $("list").append(el("div", "item notice", String(err.message || err)));
  scrollDown();
}

// consume shows a call's updates as they arrive. They're only a preview: the
// page redraws from the record once the call has finished.
async function consume(res, id, reply) {
  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
  let buffered = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffered += value;
    const lines = buffered.split("\n");
    buffered = lines.pop();
    for (const line of lines) {
      if (!line || id !== current) continue;
      const update = JSON.parse(line);
      const follow = nearBottom();
      if (update.kind === "content") reply.text.textContent += update.text;
      if (update.kind === "reasoning") {
        reply.details.hidden = false;
        reply.reasoning.textContent += update.text;
      }
      if (follow) scrollDown();
    }
  }
}

// call runs one model call and redraws afterwards. A user message is optional:
// without one, the model responds to the conversation as it stands.
async function call(id, userText) {
  if (streaming) return;
  streaming = true;
  setBusy(true);
  try {
    for (const node of $("list").querySelectorAll(":scope > .row")) node.remove();
    if (userText !== undefined) $("list").append(el("div", "item user", userText));
    const reply = replyNode();
    $("list").append(reply.node);
    scrollDown();
    const res = userText !== undefined
      ? await postJSON(`/api/conversations/${id}/messages`, { text: userText })
      : await postJSON(`/api/conversations/${id}/reply`);
    refreshList().catch(() => {});
    await consume(res, id, reply);
  } catch (err) {
    reportError(err);
    streaming = false;
    setBusy(false);
    return;
  }
  streaming = false;
  setBusy(false);
  if (current === id) await show(id).catch(reportError);
  await refreshList().catch(reportError);
}

function runCall(id) {
  return call(id);
}

$("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = $("input").value;
  if (!text.trim() || streaming) return;
  $("input").value = "";
  try {
    if (!current) {
      const res = await postJSON("/api/conversations", { system: $("system-prompt").value });
      current = (await res.json()).id;
      location.hash = current;
      $("system-panel").hidden = true;
      $("add-system").disabled = false;
      await show(current);
    }
    await call(current, text);
  } catch (err) {
    reportError(err);
  }
});

$("add-system").addEventListener("click", async () => {
  const text = $("input").value;
  if (!text.trim() || !current) return;
  try {
    await postJSON(`/api/conversations/${current}/system`, { text });
    $("input").value = "";
    await show(current);
  } catch (err) {
    reportError(err);
  }
  $("input").focus();
});

$("input").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    $("form").requestSubmit();
  }
});

$("new").addEventListener("click", () => {
  startNew().catch(reportError);
  $("input").focus();
});

(async () => {
  const id = location.hash.slice(1);
  if (id) {
    try {
      await open(id);
      return;
    } catch {
      // Fall through to a new conversation.
    }
  }
  await startNew();
  $("input").focus();
})().catch(reportError);
</script>
</body>
</html>
