<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tack</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/markdown.js" defer></script>
<script src="/static/json.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<aside id="sidebar">
  <a class="brand" href="/" aria-label="tack, start a new conversation">
    <svg class="tack" viewBox="0 0 24 24" aria-hidden="true">
      <path class="tack-pin" d="M12 13 L12 23 L12.9 13 Z M12 13 L11.1 13 L12 23 Z"/>
      <ellipse class="tack-head" cx="12" cy="8.5" rx="9" ry="6.5"/>
      <ellipse class="tack-shine" cx="9" cy="6.6" rx="3.2" ry="1.5"/>
    </svg>
    <span>tack</span>
  </a>
  <button class="new" id="new" type="button"><span aria-hidden="true">+</span> New conversation</button>
  <nav id="conversations" aria-label="Conversations"></nav>
  <div class="sidebar-foot">
    <button class="mini" id="reload" type="button" title="Read the config file again">Reload config</button>
    <div id="reload-note" class="hint" role="status"></div>
  </div>
</aside>
<div id="scrim"></div>
<main>
  <header id="head">
    <button class="icon" id="menu" type="button" aria-label="Show conversations" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <h1 id="title">New conversation</h1>
    <div id="meta"></div>
  </header>
  <div id="items">
    <div class="column">
      <section id="start">
        <svg class="tack big" viewBox="0 0 24 24" aria-hidden="true">
          <path class="tack-pin" d="M12 13 L12 23 L12.9 13 Z M12 13 L11.1 13 L12 23 Z"/>
          <ellipse class="tack-head" cx="12" cy="8.5" rx="9" ry="6.5"/>
          <ellipse class="tack-shine" cx="9" cy="6.6" rx="3.2" ry="1.5"/>
        </svg>
        <p class="lede">What are we working on?</p>
        <div id="prompt-options"></div>
        <label for="system-prompt">System prompt for this conversation. This is exactly what will be sent. Clear it to send none.</label>
        <textarea id="system-prompt" rows="7"></textarea>
        <div id="start-details"></div>
      </section>
      <div id="list"></div>
    </div>
  </div>
  <div id="controls"></div>
  <form id="form">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message" aria-label="Message"></textarea>
      <div class="composer-row">
        <span class="hint-keys">Enter to send · Shift+Enter for a new line</span>
        <button class="quiet" id="hold" type="button" title="Adds this as your message, but doesn't call the model. It goes with the next call">Hold</button>
        <button class="quiet" id="add-system" type="button" title="Waits for the next call, unless you ask the model to respond now">Add as system</button>
        <button class="send" id="send" type="submit">Send</button>
      </div>
    </div>
  </form>
</main>
</body>
</html>
