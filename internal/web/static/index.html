<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tack</title>
<meta name="tack-page" content="{{page_version}}" data-required="{{page_required}}">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/markdown.js" defer></script>
<script src="/static/json.js" defer></script>
<script src="/static/money.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<aside id="sidebar">
  <a class="brand" href="/" aria-label="tack, start a new conversation">
    <svg class="tack" viewBox="0 0 24 24" aria-hidden="true">
      <path class="tack-pin" d="M12 13 L12 23 L12.9 13 Z M12 13 L11.1 13 L12 23 Z"/>
      <ellipse class="tack-head" cx="12" cy="8.5" rx="9" ry="6.5"/>
      <ellipse class="tack-shine" cx="9" cy="6.6" rx="3.2" ry="1.5"/>
    </svg>
    <span>tack</span>
  </a>
  <button class="new net" id="new" type="button"><span aria-hidden="true">+</span> New conversation</button>
  <nav id="conversations" aria-label="Conversations"></nav>
  <div class="sidebar-foot">
    <button class="mini" id="page-update" type="button" title="There's a newer version of this page. Reloading keeps what you've typed" hidden>Reload page</button>
    <button class="mini net" id="reload" type="button" title="Read the config file again">Reload config</button>
    <div id="reload-note" class="hint" role="status"></div>
  </div>
</aside>
<div id="scrim"></div>
<main>
  <header id="head">
    <button class="icon" id="menu" type="button" aria-label="Show conversations" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <h1 id="title">New conversation</h1>
    <div id="link" role="status"><span class="link-dot"></span><span id="link-label"></span></div>
    <div id="meta"></div>
  </header>
  <div id="items">
    <div class="column">
      <section id="start">
        <svg class="tack big" viewBox="0 0 24 24" aria-hidden="true">
          <path class="tack-pin" d="M12 13 L12 23 L12.9 13 Z M12 13 L11.1 13 L12 23 Z"/>
          <ellipse class="tack-head" cx="12" cy="8.5" rx="9" ry="6.5"/>
          <ellipse class="tack-shine" cx="9" cy="6.6" rx="3.2" ry="1.5"/>
        </svg>
        <p class="lede">What are we working on?</p>
        <div id="prompt-options"></div>
        <label for="system-prompt">System prompt for this conversation. This is exactly what will be sent. Clear it to send none.</label>
        <textarea id="system-prompt" rows="7"></textarea>
        <div id="start-details"></div>
      </section>
      <div id="list"></div>
    </div>
  </div>
  <div id="controls"></div>
  <form id="form">
    <div class="composer">
      <div class="message-field" id="message-fields">
        <label class="field-row" id="custom-role-row" hidden>Role <input id="custom-role" type="text" autocomplete="off" placeholder="developer" aria-label="Role name"></label>
        <label class="field-row" id="tool-call-row" hidden>Answers <select id="tool-call-id" aria-label="Tool call this answers"></select></label>
        <details id="more-fields">
          <summary>More fields</summary>
          <label class="field-row" id="name-row">Name <input id="message-name" type="text" autocomplete="off" aria-label="Message name"></label>
          <div id="reasoning-row" hidden><label class="field-label" for="message-reasoning">Reasoning</label><textarea id="message-reasoning" rows="2"></textarea></div>
          <div id="calls-row" hidden>
            <div id="message-calls"></div>
            <button class="mini" id="add-call" type="button">Add tool call</button>
          </div>
          <div class="refused" id="refused-row"></div>
        </details>
      </div>
      <textarea id="input" rows="1" placeholder="Message" aria-label="Message"></textarea>
      <div class="composer-row">
        <select id="role" aria-label="Who this message is from">
          <option value="user">User</option>
          <option value="system">System</option>
          <option value="assistant">Assistant</option>
          <option value="tool">Tool</option>
          <option value="custom">Custom</option>
        </select>
        <span class="hint-keys">Enter to send · Shift+Enter for a new line</span>
        <button class="quiet" id="hold" type="button" title="Adds this message, but doesn't call the model. It goes with the next call">Hold</button>
        <button class="send spends" id="send" type="submit">Send</button>
      </div>
      <div id="spend"></div>
    </div>
  </form>
</main>
<div id="toast" role="status" hidden></div>
</body>
</html>
