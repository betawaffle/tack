<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt · tack</title>
<meta name="tack-page" content="{{page_version}}" data-required="{{page_required}}">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/prompt.css">
<script src="/static/money.js" defer></script>
<script src="/static/prompt-layout.js" defer></script>
<script src="/static/prompt.js" defer></script>
</head>
<body class="prompt-page">
<header class="prompt-head">
  <a class="brand" href="/" aria-label="tack, back to conversations">
    <svg class="tack" viewBox="0 0 24 24" aria-hidden="true">
      <path class="tack-pin" d="M12 13 L12 23 L12.9 13 Z M12 13 L11.1 13 L12 23 Z"/>
      <ellipse class="tack-head" cx="12" cy="8.5" rx="9" ry="6.5"/>
      <ellipse class="tack-shine" cx="9" cy="6.6" rx="3.2" ry="1.5"/>
    </svg>
  </a>
  <a id="back" class="mini" href="/">Conversation</a>
  <button id="edit" class="mini" type="button" hidden>Edit</button>
  <div class="head-group" role="group" aria-label="Which call">
    <button id="prev" class="mini" type="button" aria-label="The call before">←</button>
    <span id="which" class="prompt-which"></span>
    <button id="next" class="mini" type="button" aria-label="The call after">→</button>
  </div>
  <span class="spacer"></span>
  <div class="head-group" role="group" aria-label="What to show">
    <button class="mini toggle" type="button" data-switch="changes">Changes</button>
    <button class="mini toggle" type="button" data-switch="cache">Cache</button>
    <button class="mini toggle" type="button" data-switch="wrap">Wrap</button>
    <button class="mini toggle" type="button" data-switch="numbers">Line Numbers</button>
    <button class="mini toggle" type="button" data-switch="pretty">Pretty JSON</button>
    <button class="mini toggle" type="button" data-switch="wide">Wide</button>
  </div>
</header>
<div id="error" class="prompt-error" hidden></div>
<main id="prompt" class="prompt-body" aria-label="The prompt"></main>
<footer id="send-bar" class="send-bar" hidden>
  <label>Effort <select id="send-effort"></select></label>
  <label>Max Tokens <input id="send-max" type="number" min="1" step="1" placeholder="host's limit"></label>
  <details class="send-more">
    <summary>More</summary>
    <label>Temperature <input data-param="temperature" type="number" step="0.05" min="0" max="2"></label>
    <label>Top P <input data-param="top_p" type="number" step="0.05" min="0" max="1"></label>
    <label>Top K <input data-param="top_k" type="number" step="1" min="0"></label>
    <label>Seed <input data-param="seed" type="number" step="1"></label>
  </details>
  <span class="spacer"></span>
  <span id="send-estimate" class="send-estimate"></span>
  <button id="send" class="mini spends" type="button">Send</button>
</footer>
<aside class="legend" aria-label="Legend">
  <div class="legend-group">
    <span class="legend-item k-system"><i></i>System</span>
    <span class="legend-item k-user"><i></i>User</span>
    <span class="legend-item k-assistant"><i></i>Model</span>
  </div>
  <div class="legend-group">
    <span class="legend-item"><span class="sample t">&lt;｜User｜&gt;</span>Format</span>
    <span class="legend-item"><span class="sample f">text</span>Request</span>
  </div>
  <div id="legend-changes" class="legend-group">
    <span class="legend-item"><span class="sample tok ins">text</span>Inserted</span>
    <span class="legend-item"><span class="sample tok del">text</span>Deleted</span>
  </div>
  <div id="legend-cache" class="legend-group">
    <span class="legend-item"><span class="sample tok nc">text</span>Not Cached Next Call</span>
  </div>
  <div id="counts" class="legend-group counts"></div>
</aside>
</body>
</html>
